---
# AWX custom credential type: exposes a username/password pair to playbooks
# as extra vars Username_Lin_svc / Password_Lin_svc. Both inputs are meant to be
# linked (External Secret Management) to a "HashiCorp Vault Secret Lookup"
# credential pointing at the Akeyless HVP endpoint.
name: Linux Service Account (Akeyless HVP)
kind: cloud
inputs:
  fields:
    - id: username
      type: string
      label: Username
    - id: password
      type: string
      label: Password
      secret: true
  required:
    - username
    - password
injectors:
  extra_vars:
    Username_Lin_svc: "{{ username }}"
    Password_Lin_svc: "{{ password }}"
