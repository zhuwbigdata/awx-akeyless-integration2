---
# Prints the username/password of the AWX Machine credential (linux_server_cred)
# attached to the job template. AWX passes a Machine credential to ansible as the
# connection user (-u) and SSH password (--ask-pass); ansible exposes them to
# tasks as ansible_user / ansible_password.
- name: Print Injected AWX Credential Variables 10 Minutes Apart
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Print injected variables (Initial Output)
      ansible.builtin.debug:
        msg:
          - "Initial Output:"
          - "user_name: {{ ansible_user }}"
          - "pass_word: {{ ansible_password }}"

    - name: Pause execution for 10 minutes (600 seconds)
      ansible.builtin.pause:
        seconds: 600
        prompt: "Waiting 10 minutes before second output..."

    - name: Print injected variables (10 Minutes Later)
      ansible.builtin.debug:
        msg:
          - "Output after 10-minute delay:"
          - "user_name: {{ ansible_user }}"
          - "pass_word: {{ ansible_password }}"
