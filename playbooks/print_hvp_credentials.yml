---
- name: Print Injected AWX Credential Variables 10 Minutes Apart
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Print injected variables (Initial Output)
      ansible.builtin.debug:
        msg:
          - "Initial Output:"
          - "user_name: {{ Username_Lin_svc }}"
          - "pass_word: {{ Password_Lin_svc }}"

    - name: Pause execution for 10 minutes (600 seconds)
      ansible.builtin.pause:
        seconds: 600
        prompt: "Waiting 10 minutes before second output..."

    - name: Print injected variables (10 Minutes Later)
      ansible.builtin.debug:
        msg:
          - "Output after 10-minute delay:"
          - "user_name: {{ Username_Lin_svc }}"
          - "pass_word: {{ Password_Lin_svc }}"
